name: GitHub Pages へ公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: コードを読み込む
        uses: actions/checkout@v4
      - name: GitHub Pages を準備する
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: サイトのファイルをまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
