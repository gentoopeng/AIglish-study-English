name: DeepSeek Editor (解釈コメント付き)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  edit-and-report:
    if: contains(github.event.comment.body, '/edit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: aiderインストール
        run: pip install aider-chat

      - name: DeepSeekに編集させる（解釈も出力させる）
        run: |
          aider --model deepseek/deepseek-coder \
                --api-key deepseek=$DEEPSEEK_API_KEY \
                --yes \
                --message "リポジトリのコードを分析し、改善点があれば直接ファイルを書き換えてください。\n\n【重要】ファイルを書き換えたら、最後に以下の形式で出力してください：\n- 変更した理由（なぜその変更をしたのか）\n- 変更の具体的な内容（どのファイルの何をどう変えたか）" \
                --no-auto-commits 2>&1 | tee aider_output.txt
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "AI編集: /edit コマンドによる自動修正"
            git push origin main
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: AIの解釈と変更内容をIssueにコメント
        if: env.CHANGED == 'true'
        run: |
          # AIの出力（解釈）を取得（最初の50行に制限）
          AI_OUTPUT=$(head -n 50 aider_output.txt)
          # 変更の統計情報
          DIFF_STAT=$(git show HEAD --stat)
          # コメントを投稿
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ **AIが編集を完了しました（mainに反映済み）**\n\n**🤖 AIの解釈・変更理由**\n\`\`\`\n$AI_OUTPUT\n\`\`\`\n\n**📊 変更の統計**\n\`\`\`\n$DIFF_STAT\n\`\`\`\n\n💡 編集内容はmainブランチに直接コミットされました。詳細は [Commits](https://github.com/${{ github.repository }}/commits/main/) で確認できます。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 変更なしの報告
        if: env.CHANGED == 'false'
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "📝 **AIがコードを確認しましたが、特に編集すべき点は見つかりませんでした。**\n\n（AIの出力ログ）\n\`\`\`\n$(head -n 20 aider_output.txt)\n\`\`\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
