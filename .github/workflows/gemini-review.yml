name: Kimi K3 Editor (キーワード検索・絞り込み版)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  edit-and-report:
    if: contains(github.event.comment.body, '/edit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: OpenAIライブラリをインストール
        run: pip install openai

      - name: キーワード検索＋対象ファイル抽出＋編集
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python << 'EOF'
          import openai
          import os
          import glob
          import re
          import time
          import subprocess

          comment = os.environ.get('COMMENT_BODY', '')
          # 「/edit」以降の文章を指示として抽出
          instruction = re.sub(r'^/edit\s*', '', comment).strip()
          if not instruction:
              instruction = "コードをレビューして改善点を教えてください"

          # キーワード抽出（日本語・英語の重要単語）
          keywords = re.findall(r'[\w\-]+', instruction)
          keywords = [k.lower() for k in keywords if len(k) > 2]

          # 検索対象の拡張子
          extensions = ['*.py', '*.js', '*.html', '*.css', '*.json', '*.md', '*.txt', '*.ts', '*.jsx', '*.tsx']
          all_files = []
          for ext in extensions:
              all_files.extend(glob.glob(f'**/{ext}', recursive=True))

          # キーワードでファイルを絞り込み（grep検索）
          matched_files = set()
          for kw in keywords[:5]:  # 最初の5キーワードで検索
              for f in all_files:
                  try:
                      # ファイル名にキーワードが含まれているか
                      if kw in f.lower():
                          matched_files.add(f)
                          continue
                      # ファイル内容にキーワードが含まれているか（最初の50行だけチェック）
                      with open(f, 'r', encoding='utf-8', errors='ignore') as rf:
                          content = rf.read(5000)  # 先頭5000文字だけチェック
                          if kw in content.lower():
                              matched_files.add(f)
                  except:
                      pass

          # 検索結果が0なら、キーワードの代わりにファイル名のパターンで検索
          if not matched_files:
              for f in all_files:
                  for kw in keywords[:3]:
                      if kw in f.lower():
                          matched_files.add(f)

          # それでもなければ、主要なファイル（README.mdなど）をフォールバック
          if not matched_files:
              for f in ['README.md', 'index.html', 'app.py', 'main.py', 'script.js', 'style.css']:
                  if os.path.exists(f):
                      matched_files.add(f)

          # 最大10ファイルに制限
          matched_files = list(matched_files)[:10]

          # ファイル内容を読み込む
          repo_content = ""
          for f in matched_files:
              try:
                  with open(f, 'r', encoding='utf-8', errors='ignore') as rf:
                      content = rf.read()
                      repo_content += f"\n\n=== {f} ===\n{content}"
              except:
                  repo_content += f"\n\n=== {f} ===\n（読み込みエラー）"

          # AIに編集を依頼
          client = openai.OpenAI(
              base_url='https://api.tokenrouter.com/v1',
              api_key=os.environ['QWEN_API_KEY'],
              timeout=120.0,
          )

          for i in range(3):
              try:
                  response = client.chat.completions.create(
                      model='moonshotai/kimi-k3-free',
                      messages=[
                          {'role': 'system', 'content': 'あなたはコードレビュアーです。'},
                          {'role': 'user', 'content': f'''
                          ユーザーからの指示: {instruction}

                          以下のファイルを分析し、指示に従って修正してください。
                          修正が必要な場合は、修正後のコードを出力してください。
                          修正が不要な場合は「特に修正すべき点はありません」と出力してください。

                          {repo_content[:40000]}
                          '''}
                      ],
                      timeout=90,
                  )
                  break
              except Exception as e:
                  if i < 2:
                      time.sleep(5)
                  else:
                      raise e

          with open('aider_output.txt', 'w') as f:
              f.write(response.choices[0].message.content)
          EOF

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "AI編集: /edit コマンドによる自動修正"
            git push origin main
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: AIの解釈をIssueにコメント
        if: env.CHANGED == 'true'
        run: |
          AI_OUTPUT=$(head -n 50 aider_output.txt)
          DIFF_STAT=$(git show HEAD --stat)
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ **AIが編集を完了しました（mainに反映済み）**\n\n**🤖 AIの解釈・変更理由**\n\`\`\`\n$AI_OUTPUT\n\`\`\`\n\n**📊 変更の統計**\n\`\`\`\n$DIFF_STAT\n\`\`\`\n\n📁 **編集対象ファイル**\n${{ steps.files.outputs.files }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 変更なしの報告
        if: env.CHANGED == 'false'
        run: |
          AI_OUTPUT=$(head -n 20 aider_output.txt)
          gh issue comment ${{ github.event.issue.number }} \
            --body "📝 **AIがコードを確認しましたが、特に編集すべき点は見つかりませんでした。**"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
