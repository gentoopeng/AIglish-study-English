name: AI Editor (複数モデル・フォールバック対応)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  edit-and-report:
    if: contains(github.event.comment.body, '/edit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: OpenAIライブラリをインストール
        run: pip install openai

      - name: AI編集（複数モデルを自動フォールバック）
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python << 'EOF'
          import openai, os, glob, re, time, subprocess

          # モデルリスト（優先順位順）
          MODELS = [
              'qwen/qwen3.8-max-free',
              'moonshotai/kimi-k3-free',
              'openai/gpt-4o-mini',
          ]

          comment = os.environ.get('COMMENT_BODY', '')
          instruction = re.sub(r'^/edit\s*', '', comment).strip() or "コードをレビューして"

          # キーワード抽出＆ファイル検索（簡易版）
          keywords = [w.lower() for w in re.findall(r'[\w\-]+', instruction) if len(w) > 2][:3]
          all_files = []
          for ext in ['*.py', '*.js', '*.html', '*.css', '*.json', '*.md', '*.ts']:
              all_files.extend(glob.glob(f'**/{ext}', recursive=True))

          matched = set()
          for kw in keywords:
              for f in all_files:
                  if kw in f.lower():
                      matched.add(f)
                      continue
                  try:
                      with open(f, 'r', encoding='utf-8', errors='ignore') as rf:
                          if kw in rf.read(3000).lower():
                              matched.add(f)
                  except:
                      pass

          matched = list(matched)[:8] or ['README.md'] if os.path.exists('README.md') else []

          content = ""
          for f in matched:
              try:
                  with open(f, 'r', encoding='utf-8', errors='ignore') as rf:
                      content += f"\n\n=== {f} ===\n{rf.read()}"
              except:
                  pass

          client = openai.OpenAI(base_url='https://api.tokenrouter.com/v1', api_key=os.environ['QWEN_API_KEY'], timeout=120)

          # フォールバック処理
          last_error = None
          for model in MODELS:
              try:
                  response = client.chat.completions.create(
                      model=model,
                      messages=[
                          {'role': 'system', 'content': 'あなたはコードレビュアーです。'},
                          {'role': 'user', 'content': f'指示: {instruction}\n\nファイル:\n{content[:40000]}'}
                      ],
                      timeout=90,
                  )
                  with open('aider_output.txt', 'w') as f:
                      f.write(response.choices[0].message.content)
                  print(f"✅ 使用モデル: {model}")
                  break
              except Exception as e:
                  last_error = e
                  print(f"⚠️ {model} が使えません: {e}")
                  time.sleep(2)
                  continue
          else:
              raise Exception(f"すべてのモデルが使えません: {last_error}")
          EOF

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "AI編集: /edit コマンドによる自動修正"
            git push origin main
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: AIの解釈をIssueにコメント
        if: env.CHANGED == 'true'
        run: |
          AI_OUTPUT=$(head -n 50 aider_output.txt)
          DIFF_STAT=$(git show HEAD --stat)
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ **AIが編集を完了しました**\n\n**🤖 AIの解釈**\n\`\`\`\n$AI_OUTPUT\n\`\`\`\n\n**📊 変更の統計**\n\`\`\`\n$DIFF_STAT\n\`\`\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 変更なしの報告
        if: env.CHANGED == 'false'
        run: |
          AI_OUTPUT=$(head -n 20 aider_output.txt)
          gh issue comment ${{ github.event.issue.number }} \
            --body "📝 **AIがコードを確認しましたが、特に編集すべき点は見つかりませんでした。**"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
