name: Qwen Editor (解釈コメント付き・無料)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  edit-and-report:
    if: contains(github.event.comment.body, '/edit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: OpenAIライブラリをインストール
        run: pip install openai

      - name: Qwenに編集させる（解釈も出力）
        run: |
          python -c "
          import openai
          import os

          client = openai.OpenAI(
              base_url='https://api.tokenrouter.com/v1',
              api_key=os.environ['QWEN_API_KEY'],
          )

          # README.md を読み込む（なければ作成）
          try:
              with open('README.md', 'r') as f:
                  code = f.read()
          except FileNotFoundError:
              code = '# README.md がありません'

          response = client.chat.completions.create(
              model='qwen/qwen3.8-max-free',
              messages=[
                  {'role': 'system', 'content': 'あなたはコードレビュアーです。'},
                  {'role': 'user', 'content': f'''
                  以下のコードを分析し、改善点があれば直接修正してください。
                  修正したコードを出力してください。

                  また、最後に以下の形式で出力してください：
                  - 変更した理由
                  - 変更の具体的な内容

                  コード:
                  {code}
                  '''}
              ]
          )

          # AIの出力を保存
          with open('aider_output.txt', 'w') as f:
              f.write(response.choices[0].message.content)

          # README.md を AI の出力で置き換え
          with open('README.md', 'w') as f:
              f.write(response.choices[0].message.content)

          print(response.choices[0].message.content)
          "
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "AI編集: /edit コマンドによる自動修正"
            git push origin main
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: AIの解釈をIssueにコメント
        if: env.CHANGED == 'true'
        run: |
          AI_OUTPUT=$(head -n 50 aider_output.txt)
          DIFF_STAT=$(git show HEAD --stat)
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ **AIが編集を完了しました（mainに反映済み）**\n\n**🤖 AIの解釈・変更理由**\n\`\`\`\n$AI_OUTPUT\n\`\`\`\n\n**📊 変更の統計**\n\`\`\`\n$DIFF_STAT\n\`\`\`\n\n💡 編集内容はmainブランチに直接コミットされました。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 変更なしの報告
        if: env.CHANGED == 'false'
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "📝 **AIがコードを確認しましたが、特に編集すべき点は見つかりませんでした。**"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
