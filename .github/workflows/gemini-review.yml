name: DeepSeek Code Editor (PR作成)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  suggest-edit:
    if: contains(github.event.comment.body, '/edit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: DeepSeek CLI (aider) をインストール
        run: pip install aider-chat

      - name: 編集用ブランチを作成
        run: |
          BRANCH="deepseek-edit-$(date +%s)"
          git checkout -b $BRANCH
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV

      - name: DeepSeekに編集させる（ここで実際に動く！）
        run: |
          aider --model deepseek/deepseek-coder \
                --api-key ${{ secrets.DEEPSEEK_API_KEY }} \
                --yes \
                --message "リポジトリのコードを分析し、改善点があれば直接ファイルを書き換えてください。"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: 変更をプッシュ
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin ${{ env.BRANCH_NAME }}

      - name: Pull Requestを作成
        if: success()
        run: |
          gh pr create \
            --title "🤖 DeepSeekが編集を提案" \
            --body "AIが /edit コマンドで編集しました。確認してマージしてください。" \
            --head ${{ env.BRANCH_NAME }} \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Issueに報告
        if: success()
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ DeepSeekが編集を完了しました！PRを確認してください。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
