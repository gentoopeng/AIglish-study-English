name: AI Edit with Custom Prompt

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  suggest-edit:
    if: contains(github.event.comment.body, '/edit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: コメントから指示を抽出
        id: extract
        run: |
          BODY="${{ github.event.comment.body }}"
          # "/edit " 以降の文章を指示として切り出す
          INSTRUCTION=$(echo "$BODY" | sed 's/^\/edit //')
          echo "instruction=$INSTRUCTION" >> $GITHUB_OUTPUT

      - name: AIに編集させる
        uses: google-github-actions/run-gemini-cli@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          args: '--skip-trust'
          prompt: |
            リポジトリのコードを分析し、以下の指示に従ってファイルを書き換えてください。
            ただし、絶対にコミットやプッシュをしないでください。

            【ユーザーからの指示】
            ${{ steps.extract.outputs.instruction }}

      - name: 変更があったか確認
        id: check
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: ブランチを作成してプッシュ
        if: steps.check.outputs.changed == 'true'
        run: |
          BRANCH="ai-edit-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH
          git commit -m "AIによる編集提案"
          git push origin $BRANCH
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV

      - name: Pull Requestを作成
        if: steps.check.outputs.changed == 'true'
        run: |
          gh pr create \
            --title "AIが編集を提案しています" \
            --body "AIが指示に従って編集しました。\n\n指示内容：${{ steps.extract.outputs.instruction }}" \
            --head ${{ env.BRANCH_NAME }} \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Issueに報告
        if: steps.check.outputs.changed == 'true'
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ AIが編集を完了しました！\nPRを確認してください。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 変更なしの報告
        if: steps.check.outputs.changed == 'false'
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "指示内容に沿った編集箇所は見つかりませんでした。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB
