<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'none'"><title>商品管理</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b1220;color:#eee8dc;font-family:system-ui,sans-serif}body{padding:16px}#adminHub{max-width:520px;margin:auto}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #596176;border-radius:10px;padding:10px 14px;background:#192338;color:#eee8dc;min-height:42px}button:disabled{opacity:.45}header,.shop-tabs,.shop-pages,.library-editor-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}header{margin-bottom:16px}header span{font-size:18px}.shop-tabs{margin-bottom:16px}.shop-tabs button{flex:1;font-size:13px}.shop-tabs button[aria-selected=true]{border-color:#d5c494;color:#d5c494}.shop-add{width:100%;margin-bottom:10px}.appearance-admin-item{display:block;text-align:left;width:100%;margin-bottom:8px;overflow-wrap:anywhere;min-height:56px}.shop-pages{justify-content:center;font-size:12px;margin-top:14px}.shop-pages button{min-height:36px;padding:6px 14px}dialog{color:inherit;background:#101a2c;border:1px solid #596176;border-radius:16px;width:min(400px,calc(100% - 24px));max-height:calc(100% - 24px);margin:auto;padding:16px;overflow:auto}dialog::backdrop{background:#0b1220}.library-editor-eyebrow{display:none}h2{font-size:18px;margin:0 0 12px}.shop-admin-form{display:grid;gap:10px}.shop-editor-fields{margin:0;padding:0;border:0;display:grid;gap:10px}.shop-editor-art{display:flex;gap:10px;align-items:center}.shop-item-preview{display:flex;width:40px;height:40px;align-items:center;justify-content:center;font-size:24px}.shop-item-preview img{width:40px;height:40px;object-fit:contain}label{display:grid;gap:5px;font-size:12px;color:#c2c8d3}input:not([type=checkbox]),select{width:100%;min-height:40px;padding:8px;border:1px solid #596176;border-radius:8px;background:#192338;color:#fff;font-size:16px}.shop-editor-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shop-photo-picker{border:1px solid #596176;border-radius:8px;padding:10px;font-size:13px;color:#eee8dc;position:relative;overflow:hidden}.shop-photo-picker input{position:absolute;inset:0;opacity:0;cursor:pointer}.shop-enabled{display:flex;align-items:center;gap:8px;white-space:nowrap;min-height:26px}.shop-enabled input{width:18px;height:18px;margin:0;flex:0 0 18px}.shop-enabled span{flex:none}.shop-save-status{font-size:12px;line-height:1.4;color:#e9b49c;min-height:32px;margin:0}.library-editor-actions button{flex:1}.library-editor-primary{border-color:#d5c494;color:#d5c494}@media(max-height:500px){body{padding:10px}header,.shop-tabs{margin-bottom:10px}.appearance-admin-item{min-height:44px;margin-bottom:6px}dialog{padding:12px}.shop-admin-form,.shop-editor-fields{gap:7px}input:not([type=checkbox]),select{min-height:36px;padding:6px}.shop-save-status{min-height:26px}}
